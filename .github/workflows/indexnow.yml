name: Submit deployed public URLs to IndexNow
on:
  workflow_run:
    workflows: [Deploy static content to Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: indexnow-main
  cancel-in-progress: true
jobs:
  submit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for live key and submit sitemap URLs
        run: node docs/scripts/indexnow.mjs --wait
