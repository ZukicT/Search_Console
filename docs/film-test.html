<!doctype html><meta name=robots content=noindex><meta name=viewport content="width=device-width"><body style="font:13px monospace">
<script>
navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>{document.body.insertAdjacentHTML('afterbegin','<div>sw='+(r&&r.active?r.active.scriptURL+' ctl='+!!navigator.serviceWorker.controller:'none')+'</div>')});
['media/blink-film-2.mp4','og/film-poster.jpg'].slice(0,1).forEach((src)=>{
 const v=document.createElement('video');v.muted=true;v.autoplay=true;v.playsInline=true;v.setAttribute('playsinline','');v.controls=true;v.style.width='100%';v.poster='og/film-poster.jpg';v.src=src;
 const t=document.createElement('track');t.kind='captions';t.srclang='en';t.label='English';t.src='media/blink-film.en.vtt';v.appendChild(t);
 document.body.appendChild(v);
 const d=document.createElement('div');document.body.appendChild(d);
 const ev=[];['loadedmetadata','canplay','playing','stalled','waiting','error','suspend','abort','emptied'].forEach(e=>v.addEventListener(e,()=>ev.push(e)));
 document.addEventListener('securitypolicyviolation',e=>ev.push('CSP:'+e.violatedDirective+':'+e.blockedURI));
 setInterval(()=>{d.textContent=src+' rs='+v.readyState+' ns='+v.networkState+' t='+v.currentTime.toFixed(1)+' d='+v.duration+' err='+(v.error?v.error.code+':'+v.error.message:'-')+' '+ev.join(',')},500);
 v.play().catch(e=>ev.push('playrej:'+e.name));
});
</script>
